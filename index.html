<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PyormaVubo — AI Ассистент</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0b0f19; color: #ffffff; display: flex; height: 100vh; overflow: hidden; }
    
    /* Sidebar */
    .sidebar { width: 260px; background-color: #070a10; border-right: 1px solid #151d2a; display: flex; flex-direction: column; justify-content: space-between; padding: 20px 15px; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 25px; }
    .brand img { width: 28px; height: 28px; border-radius: 6px; }
    .brand h1 { font-size: 18px; font-weight: 700; color: #00f2fe; }
    
    .btn-new-chat { width: 100%; background: transparent; color: #00f2fe; border: 1px solid #1e293b; padding: 10px; border-radius: 8px; font-weight: 500; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: flex-start; gap: 8px; margin-bottom: 10px; transition: 0.2s; }
    .btn-new-chat:hover { border-color: #00f2fe; background: rgba(0, 242, 254, 0.05); }

    .btn-settings { width: 100%; background: #0f172a; color: #cbd5e1; border: 1px solid #1e293b; padding: 9px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; margin-bottom: 20px; transition: 0.2s; }
    .btn-settings:hover { border-color: #38bdf8; color: #fff; }
    
    .history-label { font-size: 11px; text-transform: uppercase; color: #475569; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 12px; }
    .history-list { display: flex; flex-direction: column; gap: 8px; }
    .history-item { padding: 8px 10px; border-radius: 6px; color: #94a3b8; font-size: 13px; cursor: pointer; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-item:hover { background-color: #0f172a; color: #fff; }
    
    .sidebar-footer { border-top: 1px solid #151d2a; padding-top: 15px; font-size: 12px; color: #64748b; display: flex; justify-content: space-between; align-items: center; }
    
    /* Main Content */
    .main { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 25px 40px; position: relative; background: #0b0f19; }
    
    .top-bar { display: flex; justify-content: flex-end; }
    .top-btn { background: #0f172a; border: 1px solid #1e293b; color: #38bdf8; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; text-decoration: none; }
    .top-btn:hover { border-color: #38bdf8; }
    
    .hero { text-align: center; margin-top: -20px; }
    .hero h2 { font-size: 38px; font-weight: 800; color: #00f2fe; margin-bottom: 10px; letter-spacing: -0.5px; }
    .hero p { color: #64748b; font-size: 14px; }
    
    .cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 720px; margin: 30px auto 0 auto; width: 100%; }
    .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 10px; padding: 16px; text-align: left; cursor: pointer; transition: 0.2s; }
    .card:hover { border-color: #00f2fe; }
    .card-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    .card-desc { font-size: 12px; color: #475569; }
    
    /* Chat Input */
    .input-container { max-width: 720px; margin: 0 auto; width: 100%; position: relative; }
    .chat-input { width: 100%; background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 16px 50px 16px 45px; color: #fff; font-size: 14px; outline: none; }
    .chat-input:focus { border-color: #00f2fe; }
    .input-plus { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #475569; font-size: 18px; cursor: pointer; }
    .input-submit { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; background: #00f2fe; border: none; border-radius: 8px; color: #000; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    /* Modal Settings */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 100; }
    .modal-overlay.active { display: flex; }
    .modal { background: #0f172a; border: 1px solid #1e293b; border-radius: 14px; width: 440px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-header h3 { font-size: 18px; color: #00f2fe; font-weight: 700; }
    .modal-close { background: none; border: none; color: #64748b; font-size: 20px; cursor: pointer; }
    .modal-close:hover { color: #fff; }
    
    .setting-group { margin-bottom: 18px; }
    .setting-label { display: block; font-size: 13px; color: #cbd5e1; font-weight: 600; margin-bottom: 8px; }
    .setting-select { width: 100%; background: #070a10; border: 1px solid #1e293b; color: #fff; padding: 10px; border-radius: 8px; font-size: 13px; outline: none; }
    .setting-select:focus { border-color: #00f2fe; }
    .btn-save { width: 100%; background: #00f2fe; color: #000; border: none; padding: 11px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 10px; }
    .btn-save:hover { opacity: 0.9; }
  </style>
</head>
