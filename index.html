<script>
    const sendBtn = document.getElementById('sendBtn');
    const userInput = document.getElementById('userInput');
    const contextMenu = document.getElementById('contextMenu');
    let activeHistoryItem = null;

    // Расширенная логика ответов ИИ
    function generateAIResponse(query) {
      const q = query.toLowerCase().trim();
      
      if (q.includes('привет') || q.includes('хай') || q.includes('здравствуй') || q.includes('салам')) {
        return "Привет! Я pyormavubo AI. Чем могу помочь тебе сегодня?";
      }
      if (q.includes('кто ты') || q.includes('ты кто') || q.includes('как тебя зовут') || q.includes('твое имя') || q.includes('твое имя')) {
        return "Я — pyormavubo AI, твой персональный нейросетевой ассистент!";
      }
      if (q.includes('что умеешь') || q.includes('что ты можешь')) {
        return "Я могу генерировать код, отвечать на вопросы, создавать сценарии, помогать с логикой и программированием!";
      }
      if (q.includes('код') || q.includes('html') || q.includes('css') || q.includes('js') || q.includes('скрипт')) {
        return "Отлично! Давай напишем код. Опиши подробнее, какой функционал нужно реализовать.";
      }
      
      return `Я принял ваш запрос: "${query}". Готов помочь с этим или ответить на любые вопросы!`;
    }

    function addHistoryItem(text) {
      const historyList = document.getElementById('historyList');
      const item = document.createElement('div');
      item.className = 'history-item';
      
      const textSpan = document.createElement('span');
      textSpan.className = 'history-text';
      textSpan.innerText = text;
      textSpan.onclick = () => quickSend(text);

      const dotsSpan = document.createElement('span');
      dotsSpan.className = 'history-dots';
      dotsSpan.innerHTML = '&#8943;'; // Символ троеточия
      dotsSpan.onclick = (e) => {
        e.stopPropagation();
        openContextMenu(e, item);
      };

      item.appendChild(textSpan);
      item.appendChild(dotsSpan);
      historyList.prepend(item);
    }

    function openContextMenu(e, item) {
      activeHistoryItem = item;
      contextMenu.style.top = `${e.clientY}px`;
      contextMenu.style.left = `${e.clientX + 10}px`;
      contextMenu.classList.add('active');
    }

    document.addEventListener('click', () => {
      contextMenu.classList.remove('active');
    });

    function actionMenu(type) {
      if (!activeHistoryItem) return;
      if (type === 'delete') {
        activeHistoryItem.remove();
      } else if (type === 'rename') {
        const textSpan = activeHistoryItem.querySelector('.history-text');
        const newText = prompt('Введите новое название:', textSpan.innerText);
        if (newText) textSpan.innerText = newText;
      } else if (type === 'share') {
        alert('Ссылка на чат скопирована!');
      } else if (type === 'pin') {
        document.getElementById('historyList').prepend(activeHistoryItem);
      }
      contextMenu.classList.remove('active');
    }

    function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      document.getElementById('heroSection').style.display = 'none';
      const chatBox = document.getElementById('chatBox');
      chatBox.style.display = 'flex';

      const userMsg = document.createElement('div');
      userMsg.className = 'msg msg-user';
      userMsg.innerText = text;
      chatBox.appendChild(userMsg);

      userInput.value = '';
      addHistoryItem(text);

      setTimeout(() => {
        const aiMsg = document.createElement('div');
        aiMsg.className = 'msg msg-ai';
        aiMsg.innerText = generateAIResponse(text);
        chatBox.appendChild(aiMsg);
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 300);

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    sendBtn.onclick = sendMessage;
    userInput.onkeydown = (e) => { if (e.key === 'Enter') sendMessage(); };

    function quickSend(text) {
      userInput.value = text;
      sendMessage();
    }

    function resetChat() {
      document.getElementById('heroSection').style.display = 'block';
      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML = '';
      chatBox.style.display = 'none';
    }

    window.onload = () => {
      ['Настройка Telegram бота', 'Генерация кода HTML/CSS', 'Создание интерфейса ИИ'].forEach(addHistoryItem);
    };
  </script>
