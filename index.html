<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pyormavubo UI</title>
  <style>
    /* Основные стили и сброс */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Боковая панель */
    .sidebar {
      width: 260px;
      background-color: #111827;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      padding: 16px;
      justify-content: space-between;
    }

    .brand {
      font-size: 1.2rem;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn-new-chat {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 500;
      text-align: left;
      transition: background 0.2s;
    }

    .btn-new-chat:hover {
      background: #334155;
    }

    /* Главный контейнер чата */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }

    /* 1. Верхняя панель (Header) */
    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      background: rgba(17, 24, 39, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .model-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 1.05rem;
    }

    /* Мощный эмодзи-символ */
    .power-emoji {
      font-size: 1.3rem;
      animation: pulse 2s infinite alternate;
      display: inline-block;
    }

    @keyframes pulse {
      0% { transform: scale(1); filter: drop-shadow(0 0 2px #38bdf8); }
      100% { transform: scale(1.15); filter: drop-shadow(0 0 10px #818cf8); }
    }

    /* Переключатель голоса */
    .voice-toggle-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 6px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .voice-toggle-btn.active {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border-color: #10b981;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.25);
    }

    /* Область сообщений */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 75%;
      padding: 14px 18px;
      border-radius: 16px;
      line-height: 1.5;
      font-size: 0.95rem;
      position: relative;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: #2563eb;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message.bot {
      align-self: flex-start;
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom-left-radius: 4px;
    }

    /* Поле ввода */
    .chat-input-area {
      padding: 16px 24px;
      background: #0b0f19;
      display: flex;
      gap: 12px;
    }

    .chat-input-area input {
      flex: 1;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px 16px;
      color: #fff;
      outline: none;
    }

    .chat-input-area input:focus {
      border-color: #38bdf8;
    }

    .btn-send {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 0 20px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* 2. Контекстное меню профиля / действий в стиле ChatGPT */
    .profile-section {
      position: relative;
    }

    .profile-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px;
      border-radius: 12px;
      cursor: pointer;
      color: #f8fafc;
    }

    .avatar {
      width: 32px;
      height: 32px;
      background: #6366f1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* Выпадающее меню */
    .dropdown-menu {
      display: none;
      position: absolute;
      bottom: 50px;
      left: 0;
      width: 240px;
      background: #182232;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 8px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      z-index: 100;
    }

    .dropdown-menu.show {
      display: block;
    }

    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      color: #cbd5e1;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      position: relative;
    }

    .menu-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .menu-item .arrow {
      font-size: 0.8rem;
      opacity: 0.6;
    }

    /* Выезжающее Вложенное подменю (Submenu) */
    .submenu {
      display: none;
      position: absolute;
      left: 100%;
      bottom: 0;
      margin-left: 8px;
      width: 220px;
      background: #182232;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 8px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
    }

    .has-submenu:hover .submenu {
      display: block;
    }

    .menu-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 6px 0;
    }
  </style>
</head>
<body>

  <!-- Боковая панель -->
  <aside class="sidebar">
    <div>
      <div class="brand">
        <span>pyormavubo</span>
      </div>
      <button class="btn-new-chat">+ Новый чат</button>
    </div>

    <!-- Контекстное меню снизу -->
    <div class="profile-section">
      <!-- Главное выпадающее меню -->
      <div class="dropdown-menu" id="profileDropdown">
        <div class="menu-item has-submenu">
          <span>👤 Аккаунт</span>
          <span class="arrow">▶</span>
          
          <!-- Подменю выбора профиля (как на скриншоте) -->
          <div class="submenu">
            <div class="menu-item">
              <div>
                <strong>or assistent</strong><br>
                <small style="color: #64748b;">assistancefr@gmail.com</small>
              </div>
              <span>✓</span>
            </div>
            <div class="menu-divider"></div>
            <div class="menu-item">+ Добавить аккаунт</div>
          </div>
        </div>

        <div class="menu-item">⚙️ Настройки</div>
        <div class="menu-item">🎨 Персонализация</div>
        <div class="menu-divider"></div>
        
        <div class="menu-item has-submenu">
          <span>🚪 Выйти</span>
          <span class="arrow">▶</span>
          
          <!-- Подменю выхода -->
          <div class="submenu">
            <div class="menu-item">Выйти из этого аккаунта</div>
            <div class="menu-item" style="color: #ef4444;">Выйти из всех аккаунтов</div>
          </div>
        </div>
      </div>

      <!-- Кнопка вызова меню -->
      <div class="profile-btn" onclick="toggleDropdown()">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div class="avatar">OA</div>
          <span>or assistent</span>
        </div>
        <span>⋮</span>
      </div>
    </div>
  </aside>

  <!-- Главный интерфейс чата -->
  <main class="chat-container">
    <!-- Верхняя шапка -->
    <header class="chat-header">
      <div class="model-info">
        <span class="power-emoji">⚡</span>
        <span>Cosmic Pro AI</span>
      </div>

      <!-- Переключатель режима голоса -->
      <button id="voiceToggleBtn" class="voice-toggle-btn active" onclick="toggleVoiceMode()">
        <span id="voiceIcon">🎙️</span>
        <span id="voiceStatus">Голос: ВКЛ</span>
      </button>
    </header>

    <!-- Сообщения чата -->
    <section class="chat-messages" id="chatMessages">
      <div class="message bot">
        Привет! Я готов решить твой запрос. Чем могу помочь сегодня? 😎
      </div>
    </section>

    <!-- Поле ввода -->
    <footer class="chat-input-area">
      <input type="text" id="userInput" placeholder="Введите сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button class="btn-send" onclick="sendMessage()">Отправить</button>
    </footer>
  </main>

  <script>
    // Логика переключения режима голоса
    let isVoiceEnabled = true;

    function toggleVoiceMode() {
      isVoiceEnabled = !isVoiceEnabled;
      const btn = document.getElementById('voiceToggleBtn');
      const statusText = document.getElementById('voiceStatus');
      
      if (isVoiceEnabled) {
        btn.classList.add('active');
        statusText.innerText = 'Голос: ВКЛ';
      } else {
        btn.classList.remove('active');
        statusText.innerText = 'Голос: ВЫКЛ';
      }
    }

    // Логика выпадающего меню
    function toggleDropdown() {
      const dropdown = document.getElementById('profileDropdown');
      dropdown.classList.toggle('show');
    }

    // Закрывать меню при клике вне его
    window.onclick = function(event) {
      if (!event.target.closest('.profile-section')) {
        const dropdown = document.getElementById('profileDropdown');
        if (dropdown.classList.contains('show')) {
          dropdown.classList.remove('show');
        }
      }
    }

    // Отправка сообщений в чат
    function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const chat = document.getElementById('chatMessages');

      // Сообщение пользователя
      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.innerText = text;
      chat.appendChild(userMsg);

      input.value = '';
      chat.scrollTop = chat.scrollHeight;

      // Ответ бота с задержкой
      setTimeout(() => {
        const botMsg = document.createElement('div');
        botMsg.className = 'message bot';
        botMsg.innerText = 'Принято! Разбираю твой запрос 🔥';
        chat.appendChild(botMsg);
        chat.scrollTop = chat.scrollHeight;
      }, 600);
    }
  </script>
</body>
</html>
