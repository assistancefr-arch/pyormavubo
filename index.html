<script>
  const modal = document.getElementById('settingsModal');
  const openBtn = document.getElementById('openSettingsBtn');
  const closeBtn = document.getElementById('closeSettingsBtn');
  const saveBtn = document.getElementById('saveSettingsBtn');
  const sendBtn = document.getElementById('sendBtn');
  const userInput = document.getElementById('userInput');

  openBtn.onclick = function() { modal.classList.add('active'); };
  closeBtn.onclick = function() { modal.classList.remove('active'); };

  // Ваши фирменные приветствия
  const pyormaGreetings = [
    "Система должна подняться. Чего будем обсуждать?",
    "Система готова. Какой проект запустим?",
    "На связи. С какой задачи начнем?",
    "Канал связи открыт. Что делаем?"
  ];

  function applyGreeting() {
    const savedName = localStorage.getItem('pyorma_username');
    const randomIndex = Math.floor(Math.random() * pyormaGreetings.length);
    const baseText = pyormaGreetings[randomIndex];

    if (savedName && savedName.trim() !== '') {
      document.getElementById('dynamicGreeting').innerText = `${savedName}! ${baseText}`;
    } else {
      document.getElementById('dynamicGreeting').innerText = baseText;
    }
  }

  // Динамические подсказки в инпуте
  const hints = [
    "Запросить код HTML/CSS...",
    "Описать логику для бота...",
    "Задать технический вопрос...",
    "Сгенерировать идею проекта..."
  ];
  let hintIndex = 0;

  function rotateHints() {
    setInterval(() => {
      if (document.activeElement !== userInput && userInput.value === '') {
        userInput.placeholder = hints[hintIndex];
        hintIndex = (hintIndex + 1) % hints.length;
      }
    }, 3500);
  }

  saveBtn.onclick = function() {
    const userName = document.getElementById('userNameInput').value.trim();
    localStorage.setItem('pyorma_username', userName);
    applyGreeting();
    modal.classList.remove('active');
  };

  // Функция обращения к реальному ИИ через открытый API
  async function fetchAIResponse(promptText) {
    try {
      const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(promptText)}?model=openai`);
      if (!response.ok) throw new Error("Ошибка сети");
      const data = await response.text();
      return data;
    } catch (error) {
      return "⚠️ Ошибка подключения к серверу ИИ. Попробуйте еще раз.";
    }
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    const hero = document.getElementById('heroSection');
    const chatBox = document.getElementById('chatBox');

    hero.style.display = 'none';
    chatBox.style.display = 'flex';

    // 1. Отображаем сообщение пользователя
    const userMsg = document.createElement('div');
    userMsg.className = 'msg msg-user';
    userMsg.innerText = text;
    chatBox.appendChild(userMsg);

    userInput.value = '';

    // Добавляем в историю слева
    const historyList = document.getElementById('historyList');
    const histItem = document.createElement('div');
    histItem.className = 'history-item';
    histItem.innerText = text;
    histItem.onclick = function() { quickSend(text); };
    historyList.prepend(histItem);

    // 2. Создаем плашку «Печатает...»
    const aiMsg = document.createElement('div');
    aiMsg.className = 'msg msg-ai';
    aiMsg.innerText = "🧠 Генерация ответа...";
    chatBox.appendChild(aiMsg);
    chatBox.scrollTop = chatBox.scrollHeight;

    // 3. Запрашиваем реальный ответ у ИИ
    const aiResponse = await fetchAIResponse(text);
    aiMsg.innerText = aiResponse;
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  sendBtn.onclick = sendMessage;
  userInput.onkeydown = function(e) {
    if (e.key === 'Enter') sendMessage();
  };

  function quickSend(text) {
    userInput.value = text;
    sendMessage();
  }

  function resetChat() {
    document.getElementById('heroSection').style.display = 'block';
    const chatBox = document.getElementById('chatBox');
    chatBox.innerHTML = '';
    chatBox.style.display = 'none';
    applyGreeting();
  }

  window.addEventListener('DOMContentLoaded', () => {
    const savedName = localStorage.getItem('pyorma_username') || '';
    document.getElementById('userNameInput').value = savedName;
    
    applyGreeting();
    rotateHints();
  });
</script>
