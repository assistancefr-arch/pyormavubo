<script>
    function openSettings() {
      document.getElementById('settingsModal').classList.add('active');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('active');
    }

    function saveSettings() {
      const lang = document.getElementById('appLanguage').value;
      const desc = document.getElementById('main-desc');

      // Переводы приветственного текста под каждый из 18 языков
      const translations = {
        'ru': "Ваш персональный центр нейросетевых задач. Что сделаем сегодня?",
        'fr': "Votre centre personnel d'IA. Que faisons-nous aujourd'hui?",
        'de': "Ihr persönliches KI-Zentrum. Was machen wir heute?",
        'ja': "あなたの個人的なAIセンター。今日は何をする？",
        'en': "Your personal AI center. What are we doing today?",
        'es': "Tu centro personal de IA. ¿Qué hacemos hoy?",
        'it': "Il tuo centro AI personale. Cosa facciamo oggi?",
        'zh': "您的个人人工智能中心。今天我们要做什么？",
        'be': "Ваш персанальны цэнтр нейрасеткавых задач. Што зробім сёння?",
        'uk': "Ваш персональний центр нейромережевих завдань. Що зробимо сьогодні?",
        'la': "Centrum tuum artificialis intelligentiae. Quid hodie faciemus?", // Латинский
        'el': "Το προσωπικό σας κέντρο AI. Τι θα κάνουμε σήμερα;",
        'kk': "Сіздің жеке ИИ орталығыңыз. Бүгін не істейміз?",
        'fi': "Henkilökohtainen tekoälykeskuksesi. Mitä teemme tänään?",
        'vi': "Trung tâm AI cá nhân của bạn. Hôm nay chúng ta sẽ làm gì?",
        'ro': "Centrul tău personal de IA. Ce facem astăzi?",
        'es-cu': "Tu centro personal de IA, asere. ¿Qué hacemos hoy?",
        'bn': "আপনার ব্যক্তিগত এআই কেন্দ্র। আজ আমরা কি করব?"
      };

      // Если перевод есть в списке — меняем текст
      if (translations[lang]) {
        desc.innerText = translations[lang];
      }

      closeSettings();
    }
  </script>
