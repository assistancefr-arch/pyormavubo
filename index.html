<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pyormavubo-cosmicblaze</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { display: flex; height: 100vh; background-color: #0b0f19; color: #ffffff; overflow: hidden; }
    
    .sidebar { width: 260px; background-color: #070a10; padding: 20px 14px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #1e293b; user-select: none; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; padding-left: 6px; }
    .brand-img { width: 28px; height: 28px; border-radius: 6px; object-fit: cover; box-shadow: 0 0 10px rgba(0, 242, 254, 0.4); }
    .brand h1 { font-size: 18px; font-weight: 700; color: #00f2fe; text-shadow: 0 0 12px rgba(0,242,254,0.3); }
    
    .btn-new-chat { width: 100%; padding: 10px; background: transparent; border: 1px solid #00f2fe; color: #00f2fe; border-radius: 8px; cursor: pointer; margin-bottom: 8px; font-weight: 600; text-align: left; transition: 0.2s; }
    .btn-new-chat:hover { background: rgba(0, 242, 254, 0.1); }
    .btn-settings { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #1e293b; color: #cbd5e1; border-radius: 8px; cursor: pointer; margin-bottom: 15px; text-align: left; transition: 0.2s; }
    .btn-settings:hover { background: #1e293b; color: #fff; }
    
    .history-title { font-size: 11px; color: #475569; margin-bottom: 10px; text-transform: uppercase; font-weight: 700; padding-left: 6px; }
    .history-list { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    
    .history-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: #0f172a; border-radius: 6px; font-size: 13px; color: #94a3b8; cursor: pointer; position: relative; transition: 0.2s; }
    .history-item:hover, .history-item.active { background: #1e293b; color: #fff; }
    .history-item.active { border-left: 3px solid #00f2fe; }
    .history-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .history-dots { opacity: 0; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 14px; color: #94a3b8; transition: 0.2s; }
    .history-item:hover .history-dots { opacity: 1; }

    .main { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 20px 30px; position: relative; }
    .top-bar { display: flex; justify-content: flex-end; align-items: center; width: 100%; }
    .btn-telegram { background: rgba(14, 165, 233, 0.15); border: 1px solid rgba(14, 165, 233, 0.4); color: #38bdf8; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; text-decoration: none; }

    .hero { text-align: center; margin-top: auto; margin-bottom: auto; }
    .hero h2 { font-size: 32px; font-weight: 700; margin-bottom: 30px; color: #ffffff; }
    
    .cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 680px; margin: 0 auto; width: 100%; }
    .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 10px; padding: 14px; text-align: left; cursor: pointer; transition: 0.2s; }
    .card:hover { border-color: #00f2fe; background: #141e33; }
    .card-title { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
    .card-desc { font-size: 11px; color: #475569; }

    .chat-box { flex: 1; max-width: 680px; width: 100%; margin: 0 auto; overflow-y: auto; display: none; flex-direction: column; gap: 14px; padding-bottom: 20px; }
    .msg { padding: 12px 16px; border-radius: 12px; font-size: 13.5px; max-width: 82%; line-height: 1.5; word-break: break-word; }
    .msg-user { background: #0f172a; border: 1px solid #1e293b; align-self: flex-end; color: #fff; }
    .msg-ai { background: rgba(0, 242, 254, 0.06); border: 1px solid rgba(0, 242, 254, 0.2); align-self: flex-start; color: #e2e8f0; }

    .input-container { max-width: 680px; margin: 0 auto; width: 100%; position: relative; display: flex; align-items: center; }
    .input-plus { position: absolute; left: 15px; color: #64748b; font-size: 16px; }
    .chat-input { width: 100%; background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 12px 45px 12px 35px; color: #fff; font-size: 13px; outline: none; }
    .chat-input:focus { border-color: #00f2fe; }
    .input-submit { position: absolute; right: 8px; width: 28px; height: 28px; background: #00f2fe; border: none; border-radius: 6px; color: #000; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div class="sidebar">
    <div>
      <div class="brand">
        <img src="logo.jpg" alt="Logo" class="brand-img">
        <h1>pyormavubo</h1>
      </div>
      <button class="btn-new-chat" onclick="startNewChatSession()">+ Новый чат</button>
      <button class="btn-settings">⚙️ Настройки</button>
      <div class="history-title">История запросов</div>
      <div class="history-list" id="historyList"></div>
    </div>
    <div style="font-size: 12px; color: #64748b;">Режим: Cosmic Pro AI ⚡</div>
  </div>

  <div class="main">
    <div class="top-bar">
      <a href="https://t.me" target="_blank" class="btn-telegram">Telegram-бот ↗</a>
    </div>

    <div class="hero" id="heroSection">
      <h2>С чего начнем сегодня?</h2>
      <div class="cards-grid">
        <div class="card" onclick="sendPrompt('📘 Создать веб-код')">
          <div class="card-title" style="color: #38bdf8;">📘 Создать веб-код</div>
          <div class="card-desc">Разработка интерфейсов и блоков</div>
        </div>
        <div class="card" onclick="sendPrompt('🧠 Решить задачу')">
          <div class="card-title" style="color: #ec4899;">🧠 Решить задачу</div>
          <div class="card-desc">Алгоритмы, логика и головоломки</div>
        </div>
        <div class="card" onclick="sendPrompt('📓 Сценарий и контент')">
          <div class="card-title" style="color: #a855f7;">📓 Сценарий и контент</div>
          <div class="card-desc">Идеи для роликов и проектов</div>
        </div>
        <div class="card" onclick="sendPrompt('⚡ Объяснить тему')">
          <div class="card-title" style="color: #eab308;">⚡ Объяснить тему</div>
          <div class="card-desc">Разбор технологий и терминов</div>
        </div>
      </div>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-container">
      <span class="input-plus">+</span>
      <input type="text" class="chat-input" id="userInput" placeholder='Введите сообщение...'>
      <button class="input-submit" id="sendBtn">→</button>
    </div>
  </div>

  <script>
    let activeChatId = null;
    let chats = JSON.parse(localStorage.getItem('py_chats_v3')) || [];

    const sendBtn = document.getElementById('sendBtn');
    const userInput = document.getElementById('userInput');

    function saveChats() {
      localStorage.setItem('py_chats_v3', JSON.stringify(chats));
    }

    function generateResponse(text) {
      const q = text.toLowerCase().trim();
      if (q.includes('привет') || q.includes('здравствуй')) return "Привет! Чем я могу помочь тебе прямо сейчас?";
      if (q.includes('как тебя зовут') || q.includes('ты кто')) return "Я pyormavubo AI — твой виртуальный ассистент!";
      if (q.includes('как дела')) return "Все отлично, работаю на полной мощности! Как у тебя дела?";
      return `Запрос принят: "${text}". Задавай следующие вопросы, я с радостью отвечу!`;
    }

    function startNewChatSession() {
      activeChatId = null;
      renderHistory();
      renderMessages();
    }

    function selectChat(id) {
      activeChatId = id;
      renderHistory();
      renderMessages();
    }

    function renderHistory() {
      const historyList = document.getElementById('historyList');
      historyList.innerHTML = '';

      chats.forEach(chat => {
        const item = document.createElement('div');
        item.className = 'history-item' + (chat.id === activeChatId ? ' active' : '');
        
        const textSpan = document.createElement('span');
        textSpan.className = 'history-text';
        textSpan.innerText = chat.title;
        textSpan.onclick = () => selectChat(chat.id);

        item.appendChild(textSpan);
        historyList.appendChild(item);
      });
    }

    function renderMessages() {
      const chatBox = document.getElementById('chatBox');
      const heroSection = document.getElementById('heroSection');
      const currentChat = chats.find(c => c.id === activeChatId);

      if (currentChat && currentChat.messages.length > 0) {
        heroSection.style.display = 'none';
        chatBox.style.display = 'flex';
        chatBox.innerHTML = '';

        currentChat.messages.forEach(m => {
          const div = document.createElement('div');
          div.className = 'msg ' + (m.role === 'user' ? 'msg-user' : 'msg-ai');
          div.innerText = m.text;
          chatBox.appendChild(div);
        });

        chatBox.scrollTop = chatBox.scrollHeight;
      } else {
        heroSection.style.display = 'block';
        chatBox.style.display = 'none';
      }
    }

    function handleSend() {
      const text = userInput.value.trim();
      if (!text) return;

      let currentChat = chats.find(c => c.id === activeChatId);

      if (!currentChat) {
        const titleText = text.length > 22 ? text.substring(0, 22) + '...' : text;
        currentChat = {
          id: Date.now(),
          title: titleText,
          messages: []
        };
        chats.unshift(currentChat);
        activeChatId = currentChat.id;
      }

      currentChat.messages.push({ role: 'user', text: text });
      userInput.value = '';

      saveChats();
      renderHistory();
      renderMessages();

      setTimeout(() => {
        const reply = generateResponse(text);
        currentChat.messages.push({ role: 'ai', text: reply });
        saveChats();
        renderMessages();
      }, 350);
    }

    function sendPrompt(text) {
      userInput.value = text;
      handleSend();
    }

    sendBtn.onclick = handleSend;
    userInput.onkeydown = (e) => { if (e.key === 'Enter') handleSend(); };

    window.onload = () => {
      renderHistory();
      renderMessages();
    };
  </script>
</body>
</html>
