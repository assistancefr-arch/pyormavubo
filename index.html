<script>
  const modal = document.getElementById('settingsModal');
  const openBtn = document.getElementById('openSettingsBtn');
  const closeBtn = document.getElementById('closeSettingsBtn');
  const saveBtn = document.getElementById('saveSettingsBtn');
  const sendBtn = document.getElementById('sendBtn');
  const userInput = document.getElementById('userInput');

  openBtn.onclick = function() { modal.classList.add('active'); };
  closeBtn.onclick = function() { modal.classList.remove('active'); };

  const pyormaGreetings = [
    "Система должна подняться. Чего будем обсуждать?",
    "Система готова. Какой проект запустим?",
    "На связи. С какой задачи начнем?",
    "Канал связи открыт. Что делаем?"
  ];

  function applyGreeting() {
    const savedName = localStorage.getItem('pyorma_username');
    const randomIndex = Math.floor(Math.random() * pyormaGreetings.length);
    const baseText = pyormaGreetings[randomIndex];

    if (savedName && savedName.trim() !== '') {
      document.getElementById('dynamicGreeting').innerText = `${savedName}! ${baseText}`;
    } else {
      document.getElementById('dynamicGreeting').innerText = baseText;
    }
  }

  const hints = [
    "Запросить код HTML/CSS...",
    "Описать логику для бота...",
    "Задать технический вопрос...",
    "Сгенерировать идею проекта..."
  ];
  let hintIndex = 0;

  function rotateHints() {
    setInterval(() => {
      if (document.activeElement !== userInput && userInput.value === '') {
        userInput.placeholder = hints[hintIndex];
        hintIndex = (hintIndex + 1) % hints.length;
      }
    }, 3500);
  }

  saveBtn.onclick = function() {
    const userName = document.getElementById('userNameInput').value.trim();
    localStorage.setItem('pyorma_username', userName);
    applyGreeting();
    modal.classList.remove('active');
  };

  // База умных ответов системы pyormavubo
  function generatePyormaResponse(query) {
    const text = query.toLowerCase();

    if (text.includes('привет') || text.includes('ку') || text.includes('хай')) {
      return "Привет! Система pyormavubo готова к работе. Что пишем или тестируем сегодня?";
    }
    if (text.includes('код') || text.includes('html') || text.includes('css')) {
      return "Для работы с кодом создай файл index.html, добавь структуру HTML5, тег <style> для оформления и <script> для логики. Вся верстка готова!";
    }
    if (text.includes('бот') || text.includes('telegram')) {
      return "Чтобы привязать Telegram-бота, тебе понадобится BotFather для получения токена и сервер на Node.js или Python (python-telegram-bot).";
    }
    if (text.includes('задач') || text.includes('иде')) {
      return "Отличная цель! Давай разобьем задачу на 3 шага: 1) Проработка структуры, 2) Написание базового кода, 3) Тестирование функций.";
    }

    return `Запрос "${query}" получен и обработан ядром pyormavubo! Логика работает исправно.`;
  }

  function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    const hero = document.getElementById('heroSection');
    const chatBox = document.getElementById('chatBox');

    hero.style.display = 'none';
    chatBox.style.display = 'flex';

    const userMsg = document.createElement('div');
    userMsg.className = 'msg msg-user';
    userMsg.innerText = text;
    chatBox.appendChild(userMsg);

    userInput.value = '';

    const historyList = document.getElementById('historyList');
    const histItem = document.createElement('div');
    histItem.className = 'history-item';
    histItem.innerText = text;
    histItem.onclick = function() { quickSend(text); };
    historyList.prepend(histItem);

    // Добавляем ответ бота
    setTimeout(() => {
      const aiMsg = document.createElement('div');
      aiMsg.className = 'msg msg-ai';
      aiMsg.innerText = generatePyormaResponse(text);
      chatBox.appendChild(aiMsg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }, 300);

    chatBox.scrollTop = chatBox.scrollHeight;
  }

  sendBtn.onclick = sendMessage;
  userInput.onkeydown = function(e) {
    if (e.key === 'Enter') sendMessage();
  };

  function quickSend(text) {
    userInput.value = text;
    sendMessage();
  }

  function resetChat() {
    document.getElementById('heroSection').style.display = 'block';
    const chatBox = document.getElementById('chatBox');
    chatBox.innerHTML = '';
    chatBox.style.display = 'none';
    applyGreeting();
  }

  window.addEventListener('DOMContentLoaded', () => {
    const savedName = localStorage.getItem('pyorma_username') || '';
    document.getElementById('userNameInput').value = savedName;
    
    applyGreeting();
    rotateHints();
  });
</script>
